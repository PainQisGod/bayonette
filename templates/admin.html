{% extends "base.html" %}
{% block content %}
<section>
  <h2>Admin <span><a href="/admin/orders">Orders</a> <a class="btn" href="/admin/new">+ New product</a></span></h2>
  {% for p in products %}
  <div class="row">
    <span><b>{{ p.name }}</b> <small>{{ p.brand }} · ${{ p.price }} · {{ p.stock }} in stock</small></span>
    <span>
      <a href="/admin/edit/{{ p.id }}">Edit</a>
      <form class="inline" method="post" action="/admin/delete/{{ p.id }}" onsubmit="return confirm('Delete this product?')">
        <button>x</button>
      </form>
    </span>
  </div>
  {% endfor %}
</section>
{% endblock %}
