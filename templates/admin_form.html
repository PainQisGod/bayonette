{% extends "base.html" %}
{% block content %}
<div class="page">
  <h2>{% if product %}Edit product{% else %}New product{% endif %}</h2>
  <form method="post">
    <label>Name</label>
    <input name="name" value="{{ product.name if product }}" required>
    <label>Brand</label>
    <input name="brand" value="{{ product.brand if product }}" required>
    <label>Price ($)</label>
    <input type="number" name="price" min="1" value="{{ product.price if product }}" required>
    <label>Stock</label>
    <input type="number" name="stock" min="0" value="{{ product.stock if product else 10 }}" required>
    <label>Color (0-360)</label>
    <input type="number" name="hue" min="0" max="360" value="{{ product.hue if product else 200 }}" required>
    <label>Description</label>
    <input name="description" value="{{ product.description if product }}" required>
    <button class="btn">Save</button>
  </form>
</div>
{% endblock %}
