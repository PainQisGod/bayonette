{% extends "base.html" %}
{% block content %}
<section>
  <h2>Checkout <a href="/cart">← Back to cart</a></h2>
  <div class="checkout">
    <form method="post" class="checkout-form">
      <label>Full name</label>
      <input name="name" value="{{ form.name or '' }}" required>
      <label>Phone</label>
      <input name="phone" type="tel" value="{{ form.phone or '' }}" required>
      <label>Delivery address</label>
      <textarea name="address" required>{{ form.address or '' }}</textarea>

      <label>Payment</label>
      {% for p in payments %}
      <label class="choice">
        <input type="radio" name="payment" value="{{ p }}" {% if form.payment == p or (not form.payment and loop.first) %}checked{% endif %}>
        {{ p }}
      </label>
      {% endfor %}

      <button class="btn">Place order - ${{ total }}</button>
    </form>

    <div class="box summary">
      <b>Order summary</b>
      {% for item in items %}
      <div class="row">
        <span>{{ item.quantity }} x {{ item.product.name }}</span>
        <span>${{ item.product.price * item.quantity }}</span>
      </div>
      {% endfor %}
      <div class="total">Total: ${{ total }}</div>
    </div>
  </div>
</section>
{% endblock %}
