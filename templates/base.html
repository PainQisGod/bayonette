<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayonette</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="logo" href="/">Bayo<span>nette</span></a>
      <nav>
        <a href="/">Shop</a>
        <a href="/orders">My Orders</a>
        {% if admin_access %}<a href="/admin">Admin</a>{% endif %}
      </nav>
      <form action="/"><input name="q" placeholder="Search products" value="{{ q or '' }}"></form>
      {% if session.email %}
          <a href="/profile">Profile</a>
          <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
      {% endif %}
      <button class="theme-btn" id="theme-toggle" type="button">Dark</button>
      <a class="btn" href="/cart">Cart (<span id="cart-count">{{ cart_count }}</span>)</a>
    </div>
  </header>

  <main class="container">
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container footer-row">
      <span>© 2026 Bayonette</span>
      <span class="footer-links">
        <a href="/about">About</a>
        <a href="/faq">FAQ</a>
        <a href="/contact">Contact</a>
      </span>
    </div>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
