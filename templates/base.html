<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayonette</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="logo" href="/">Bayo<span>nette</span></a>
      <nav>
        <a href="/">Shop</a>
        <a href="/orders">My Orders</a>
      </nav>
      <form action="/"><input name="q" placeholder="Search products" value="{{ q or '' }}"></form>
      {% if session.email %}
        <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
      {% endif %}
      <a class="btn" href="/cart">Cart ({{ cart_count }})</a>
    </div>
  </header>

  <main class="container">
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer><div class="container">© 2026 Bayonette</div></footer>
</body>
</html>
